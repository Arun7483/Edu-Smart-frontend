<div class="page-container">
  <div class="page-header">
    <div>
      <h2>User Management</h2>
      <p>Manage Students, Instructors, and Admin profiles across the platform.</p>
    </div>
    <button class="btn btn-primary" (click)="openModal()">➕ Add New User</button>
  </div>

  <div class="toolbar">
    <input type="text" class="search-input" placeholder="Search by name or email..." [(ngModel)]="searchTerm" (input)="applyFilters()">
    <select class="role-filter" [(ngModel)]="roleFilter" (change)="applyFilters()">
      <option value="ALL">All Roles</option>
      <option value="ADMIN">Admins</option>
      <option value="INSTRUCTOR">Instructors</option>
      <option value="STUDENT">Students</option>
    </select>
  </div>

  <div class="table-container">
    <table class="data-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>Status</th>
          <th class="text-right">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of filteredUsers">
          <td class="font-bold">{{ user.name }}</td>
          <td>{{ user.email }}</td>
          <td><span class="badge badge-role">{{ user.role }}</span></td>
          <td>
            <span class="badge" [ngClass]="user.status === 'ACTIVE' ? 'badge-success' : 'badge-danger'">
              {{ user.status }}
            </span>
          </td>
          <td class="text-right action-buttons">
            <button class="btn-icon" title="Toggle Status" (click)="toggleStatus(user)">
              {{ user.status === 'ACTIVE' ? '⏸️' : '▶️' }}
            </button>
            <button class="btn-icon edit-btn" (click)="openModal(user)">✏️</button>
            <button class="btn-icon delete-btn" (click)="deleteUser(user.id)">🗑️</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="modal-overlay" *ngIf="isModalOpen">
    <div class="modal-content">
      <div class="modal-header">
        <h3>{{ isEditing ? 'Edit User' : 'Create New User' }}</h3>
        <button class="close-btn" (click)="closeModal()">✖</button>
      </div>
      
      <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="custom-form">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" formControlName="name" placeholder="John Doe">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" formControlName="email" placeholder="john@example.com">
        </div>
        
        <div class="form-row">
          <div class="form-group half-width">
            <label>Role</label>
            <select formControlName="role">
              <option value="STUDENT">Student</option>
              <option value="INSTRUCTOR">Instructor</option>
              <option value="ADMIN">Admin</option>
            </select>
          </div>
          <div class="form-group half-width">
            <label>Status</label>
            <select formControlName="status">
              <option value="ACTIVE">Active</option>
              <option value="SUSPENDED">Suspended</option>
            </select>
          </div>
        </div>

        <div class="form-group" *ngIf="!isEditing">
          <label>Temporary Password</label>
          <input type="text" formControlName="password" placeholder="Defaults to 'default123'">
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-secondary" (click)="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" [disabled]="userForm.invalid">Save User</button>
        </div>
      </form>
    </div>
  </div>
</div>
